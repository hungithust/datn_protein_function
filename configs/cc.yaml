# AMPR Config: Cellular Component (CC) branch

branch: CC
n_terms: 320

data:
  labels:         data/pdbch/labels_cc.npy
  dag_matrix:     data/pdbch/dag_matrix_cc.npy
  splits:         data/pdbch/splits.json
  protein_order:  data/pdbch/protein_order.json
  seq_emb:    data/embeddings/seq_embeddings.npy
  struct_emb: data/embeddings/struct_embeddings.npy
  ppi_emb:    data/embeddings/ppi_embeddings.npy
  go_emb:     data/embeddings/go_emb_cc.npy
  use_cmap: true
  cmap_h5:
    train: data/pdbch/contact_maps_train.h5
    valid: data/pdbch/contact_maps_valid.h5
    test:  data/pdbch/contact_maps_test.h5

model:
  d_hidden: 512
  dropout_3di: 0.15
  dropout_ppi: 0.25
  classifier: both
  go_emb_dim: 768
  ppi_dim: 256
  structure_modality: gnn
  gnn_input_dim: 26
  gnn_hidden_dim: 256

training:
  epochs: 50
  batch_size: 256
  lr: 1.0e-3
  lambda_dag: 0.5
  seed: 42
  device: auto

output:
  checkpoint_dir: checkpoints/cc/
  log_file: logs/cc_train.log
  results_file: results/cc_predictions.tsv
