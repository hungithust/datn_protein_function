branch: BP
n_terms: 1943
seed: 42
data:
  protein_order: data/swissmodel_art/protein_order_sm.json
  splits: data/swissmodel_art/splits_sm.json
  labels: data/swissmodel_art/labels_bp_sm.npy
  dag_matrix: data/pdbch/dag_matrix_bp.npy
  esm2_h5: data/embeddings/esm2_650m_sm.h5
  ppi_emb: data/swissmodel_art/ppi_zero_sm.npy
  ppi_mask: data/swissmodel_art/ppi_mask_sm.npy
  cmap_h5: data/swissmodel_art/cmap_all_sm.h5
  go_emb: data/embeddings/go_emb_bp_v2.npy
model:
  version: v3
  structure_modality: gnn
  seq:
    d_model: 1280
    n_transformer_layers: 2
    n_heads: 8
    dropout: 0.4
  gnn:
    node_dim: 256
    n_layers: 3
    cmap_threshold: 10.0
  ppi:
    in_dim: 256
    hidden: 512
  fusion:
    d_model: 512
    n_layers: 2
    n_heads: 8
  classifier: both
  d_hidden: 512
training:
  epochs: 30
  batch_size: 64
  lr: 0.001
  lr_scheduler: plateau
  lr_factor: 0.5
  lr_patience: 5
  lr_min: 1.0e-05
  weight_decay: 0.01
  loss_type: asl
  asl_gamma_neg: 4
  asl_gamma_pos: 0
  asl_clip: 0.05
  lambda_dag: 0.5
  seed: 42
  device: auto
  max_seq_len: 1000
  num_workers: 16
inference:
  use_dag_propagation: true
output:
  checkpoint_dir: checkpoints/bp_v6sm_pretrain/
  log_file: logs/bp_v6sm_pretrain.log
  results_file: results/bp_v6sm_pretrain_predictions.tsv
