# AMPR Config: Molecular Function (MF) branch

branch: MF
n_terms: 489

data:
  # ── Phase 0: standardized DeepFRI/HEAL-comparable splits + labels ──
  labels:         data/pdbch/labels_mf.npy
  dag_matrix:     data/pdbch/dag_matrix_mf.npy
  splits:         data/pdbch/splits.json
  protein_order:  data/pdbch/protein_order.json

  # ── Embeddings: still pointing at OLD precomputed files ──
  # These will be re-precomputed in Phase 1 to match the new protein_order.json.
  # Phase 0 smoke test uses them as-is (alignment not guaranteed).
  seq_emb:    data/embeddings/seq_embeddings.npy
  struct_emb: data/embeddings/struct_embeddings.npy
  ppi_emb:    data/embeddings/ppi_embeddings.npy
  go_emb:     data/embeddings/go_emb_mf.npy

model:
  d_hidden: 512
  dropout_3di: 0.15
  dropout_ppi: 0.25
  classifier: both
  go_emb_dim: 768
  ppi_dim: 256

training:
  epochs: 50
  batch_size: 256
  lr: 1.0e-3
  lambda_dag: 0.5
  seed: 42
  device: auto

output:
  checkpoint_dir: checkpoints/mf/
  log_file: logs/mf_train.log
  results_file: results/mf_predictions.tsv
