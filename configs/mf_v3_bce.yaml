# Fix collapse: BCEWithLogitsLoss (gradient positive sống khi logit âm sâu)
#   + pos_weight per-class chống imbalance 104:1
#   + grad_clip chặn cú đẩy quá mạnh ở epoch 1 (grad_norm ~262 -> clip về 5).
# Khác mf_v3.yaml: loss asl->bce, lr 1e-3->5e-4, thêm pos_weight_cap + grad_clip.
branch: MF
n_terms: 489
data:
  protein_order: data/pdbch/protein_order.json
  splits:        data/pdbch/splits.json
  labels:        data/pdbch/labels_mf.npy
  dag_matrix:    data/pdbch/dag_matrix_mf.npy
  esm2_h5:       data/embeddings/esm2_residue.h5
  ppi_emb:       data/embeddings/ppi_deepgo.npy
  ppi_mask:      data/embeddings/ppi_deepgo_mask.npy
  cmap_h5:       data/contact_maps/cmap_all.h5
  go_emb:        data/embeddings/go_emb_mf.npy
  diamond_tsv:   data/diamond/diamond_results_mf.tsv
model:
  version: v3
  structure_modality: gnn
  seq: {d_model: 1280, n_transformer_layers: 2, n_heads: 8, dropout: 0.1}
  gnn: {node_dim: 256, n_layers: 3, cmap_threshold: 10.0}
  ppi: {in_dim: 256, hidden: 512}
  fusion: {d_model: 512, n_layers: 2, n_heads: 8}
  classifier: both
  d_hidden: 512
training:
  epochs: 50
  batch_size: 16
  lr: 5.0e-4            # was 1.0e-3
  loss_type: bce        # was asl  (ASL clamp giết gradient khi sigmoid->0)
  pos_weight_cap: 50.0  # cap pos_weight per-class (term hiếm không quá lớn)
  grad_clip: 5.0        # chặn epoch-1 blowout
  lambda_dag: 0.5
  seed: 42
  device: auto
  max_seq_len: 1000
  num_workers: 2
inference:
  use_dag_propagation: true
  use_diamond_ensemble: true
  diamond_alpha: 0.6
  threshold_path: checkpoints/mf_v3_bce/threshold.json
output:
  checkpoint_dir: checkpoints/mf_v3_bce/
  log_file:       logs/mf_v3_bce_train.log
  results_file:   results/mf_v3_bce_predictions.tsv
seed: 42
