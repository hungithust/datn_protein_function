branch: BP
n_terms: 1943
data:
  protein_order: data/pdbch/protein_order.json
  splits:        data/pdbch/splits.json
  labels:        data/pdbch/labels_bp.npy
  dag_matrix:    data/pdbch/dag_matrix_bp.npy
  esm2_h5:       data/embeddings/esm2_residue.h5
  ppi_emb:       data/embeddings/ppi_deepgo.npy
  ppi_mask:      data/embeddings/ppi_deepgo_mask.npy
  cmap_h5:       data/contact_maps/cmap_all.h5
  go_emb:        data/embeddings/go_emb_bp.npy
  diamond_tsv:   data/diamond/diamond_results_bp.tsv
model:
  version: v3
  structure_modality: gnn
  seq: {d_model: 1280, n_transformer_layers: 2, n_heads: 8, dropout: 0.1}
  gnn: {node_dim: 256, n_layers: 3, cmap_threshold: 10.0}
  ppi: {in_dim: 256, hidden: 512}
  fusion: {d_model: 512, n_layers: 2, n_heads: 8}
  classifier: both
  d_hidden: 512
training:
  epochs: 50
  batch_size: 128       # was 16 — H200 141GB; cmap LxL + ESM residue fit easily at 128
  lr: 1.0e-3
  loss_type: asl
  asl_gamma_neg: 4
  asl_gamma_pos: 0
  asl_clip: 0.05
  lambda_dag: 0.5
  seed: 42
  device: auto
  max_seq_len: 1000
  num_workers: 16       # was 2 — 192-core box
inference:
  use_dag_propagation: true
  use_diamond_ensemble: true
  diamond_alpha: 0.6
  threshold_path: checkpoints/bp_v3/threshold.json
output:
  checkpoint_dir: checkpoints/bp_v3/
  log_file:       logs/bp_v3_train.log
  results_file:   results/bp_v3_predictions.tsv
seed: 42
