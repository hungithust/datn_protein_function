branch: BP
n_terms: 1943
data:
  protein_order: data/pdbch/protein_order.json
  splits:        data/pdbch/splits.json
  labels:        data/pdbch/labels_bp.npy
  dag_matrix:    data/pdbch/dag_matrix_bp.npy
  esm2_h5:       data/embeddings/esm2_3b_residue.h5     # NEW: 2560d
  ppi_emb:       data/embeddings/ppi_deepgo.npy
  ppi_mask:      data/embeddings/ppi_deepgo_mask.npy
  cmap_h5:       data/contact_maps/cmap_all.h5
  go_emb:        data/embeddings/go_emb_bp_v2.npy        # NEW: SapBERT+graph (896d)
  diamond_tsv:   data/diamond/diamond_results_bp.tsv
model:
  version: v3
  structure_modality: gnn
  seq: {d_model: 2560, n_transformer_layers: 2, n_heads: 8, dropout: 0.4}  # anti-overfit: 0.1 -> 0.4
  gnn: {node_dim: 256, n_layers: 3, cmap_threshold: 10.0}
  ppi: {in_dim: 256, hidden: 512}
  fusion: {d_model: 512, n_layers: 2, n_heads: 8}
  classifier: both
  d_hidden: 512
training:
  epochs: 50
  batch_size: 64          # 2560d residue is ~2x memory of 1280d; 64 safe on H200
  lr: 1.0e-3
  lr_scheduler: plateau     # gentle: halve LR when val Fmax_dag plateaus
  lr_factor: 0.5
  lr_patience: 5
  lr_min: 1.0e-5
  loss_type: asl
  asl_gamma_neg: 4
  asl_gamma_pos: 0
  asl_clip: 0.05
  lambda_dag: 0.5
  seed: 2024
  device: auto
  max_seq_len: 1000
  num_workers: 16
inference:
  use_dag_propagation: true
  use_diamond_ensemble: true
  diamond_alpha: 0.6
  threshold_path: checkpoints/bp_v5_drop04_s2024/threshold.json
output:
  checkpoint_dir: checkpoints/bp_v5_drop04_s2024/
  log_file:       logs/bp_v5_drop04_s2024_train.log
  results_file:   results/bp_v5_drop04_s2024_predictions.tsv
seed: 2024
